name: Build mfocGUI

on:
  push:
    branches:
      - master
      - main
  pull_request:

jobs:

  build-windows:

    runs-on: windows-latest

    steps:

    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Install dependencies
      shell: cmd
      run: |
        echo Preparing build environment

    - name: Fix compiler compatibility
      shell: powershell
      run: |
        echo #define PTRDIFF_MAX 9223372036854775807 > compat.h

    - name: Build
      shell: cmd
      run: |

        msbuild src\mfocGUI.sln ^
        /p:Configuration=Release ^
        /p:Platform=x64 ^
        /p:AdditionalOptions="/D PTRDIFF_MAX=9223372036854775807" ^
        /m

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: mfocGUI-release
        path: |
          src/**/Release/**/*.exe
          src/**/Release/**/*.dll
