name: Windows Build

on:
  push:
    branches:
      - master
      - develop

  pull_request:
    branches:
      - master
      - develop

  workflow_dispatch:


permissions:
  contents: read


jobs:
  build:

    runs-on: windows-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2


      - name: Inspect repository
        shell: pwsh
        run: |
          Write-Host "=============================="
          Write-Host "Repository location"
          Write-Host "=============================="

          Get-Location


          Write-Host ""
          Write-Host "=============================="
          Write-Host "Solution files"
          Write-Host "=============================="

          Get-ChildItem -Path . -Recurse -Filter *.sln |
          ForEach-Object {
              Write-Host $_.FullName
          }


          Write-Host ""
          Write-Host "=============================="
          Write-Host "Visual Studio project files"
          Write-Host "=============================="

          Get-ChildItem -Path . -Recurse -Filter *.vcxproj |
          ForEach-Object {
              Write-Host $_.FullName
          }


      - name: Retarget Windows SDK
        shell: pwsh
        run: |

          Write-Host "Updating Windows SDK version..."

          Get-ChildItem -Path . -Recurse -Filter *.vcxproj |
          ForEach-Object {

              Write-Host "Processing:"
              Write-Host $_.FullName


              $content = Get-Content $_.FullName -Raw


              $content = $content -replace `
              '<WindowsTargetPlatformVersion>8\.1</WindowsTargetPlatformVersion>', `
              '<WindowsTargetPlatformVersion>10.0</WindowsTargetPlatformVersion>'


              Set-Content $_.FullName $content
          }


      - name: Build solution
        shell: pwsh
        run: |

          Write-Host "Searching solution..."

          $sln = Get-ChildItem -Path . -Recurse -Filter *.sln |
                 Select-Object -First 1


          if ($null -ne $sln)
          {

              Write-Host "Building solution:"
              Write-Host $sln.FullName


              msbuild $sln.FullName `
                /p:Configuration=Debug `
                /p:Platform=Win32

          }
          else
          {

              Write-Host "No solution found."

              Write-Host "Searching project..."

              $proj = Get-ChildItem -Path . -Recurse -Filter *.vcxproj |
                      Select-Object -First 1


              if ($null -eq $proj)
              {
                  throw "No Visual Studio solution or project found"
              }


              Write-Host "Building project:"
              Write-Host $proj.FullName


              msbuild $proj.FullName `
                /p:Configuration=Debug `
                /p:Platform=Win32
          }
